version: '3.8'

services:
  books-service:
    build: ./app/books
    container_name: books-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks:
      - biblioteca-net
    restart: always

  loans-service:
    build: ./app/loans
    container_name: loans-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - BOOKS_SERVICE_URL=http://books-service:8001
    depends_on:
      - books-service
    networks:
      - biblioteca-net
    restart: always

networks:
  biblioteca-net:
    driver: bridge
