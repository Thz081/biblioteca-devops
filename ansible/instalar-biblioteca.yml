---
- name: Configurar Servidor Demo e Deploy
  hosts: biblioteca_servers
  tasks:
    - name: Criar pasta do projeto no servidor virtual
      shell: mkdir -p /app/biblioteca-devops
      
    - name: Simular instalacao de dependencias (Docker/Git)
      debug:
        msg: "Instalando Docker, Git e dependencias no servidor virtual..."

    - name: Deploy dos microsservicos
      debug:
        msg: "Executando docker-compose up no servidor de destino (biblioteca-server-demo)..."
