---
- name: Validação e Configuração de Segurança Pós-Deploy
  hosts: biblioteca_servers
  tasks:
    - name: DevSecOps - Garantir que o microsserviço de Livros (Books) está respondendo
      uri:
        url: http://localhost:8001/health
        return_content: yes
      register: books_health
      failed_when: "'healthy' not in books_health.content"
      retries: 5
      delay: 3

    - name: DevSecOps - Garantir que o microsserviço de Empréstimos (Loans) está respondendo
      uri:
        url: http://localhost:8002/health
        return_content: yes
      register: loans_health
      failed_when: "'healthy' not in loans_health.content"
      retries: 5
      delay: 3

    - name: Relatório de Segurança e Deploy
      debug:
        msg: "DevSecOps Concluído: Ambientes isolados validados. APIs de Livros e Empréstimos 100% online e responsivas."
